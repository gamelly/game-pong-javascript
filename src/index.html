<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Pong</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <style>
        *, *::after, *::before {
            touch-action: none;
            box-sizing: border-box;
            border: 0;
            padding: 0;
            margin: 0;
        }
        body {
            height: 99.998vh;
            display: flex;
            overflow: hidden;
            justify-content: center;
            align-items: start;
            background-color: gray;
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
  </head>
  <body>
    <main>
      <canvas id="gameCanvas"></canvas>
    </main>
    <script src="game.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@gamely/core-native-html5@0.1.4"></script>
    <script type="module">
    import { LuaFactory, LuaMultiReturn } from 'https://cdn.jsdelivr.net/npm/wasmoon@1.16.0/+esm'
    window.LuaFactory = LuaFactory
    window.LuaMultiReturn = LuaMultiReturn
    </script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
      core_native_html5()
        .set_el_root('main')
        .set_el_canvas('#gameCanvas')
        .set_library('wasmoon', window.LuaFactory, window.LuaMultiReturn)
        .set_library('resize')
        .set_library('gamepad')
        .set_library('keyboard')
        .set_library('runtime', {unfocus_pause: true})
        .set_engine('https://cdn.jsdelivr.net/npm/@gamely/gly-engine-micro@0.0.20/dist/main.lua')
        .set_game(Game)
        .build()
    })
    </script>
  </body>
</html>
